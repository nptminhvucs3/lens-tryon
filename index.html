<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Demo thử lens</title>
  <link rel="stylesheet" href="assets/css/lens-tryon.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #faf7f8; color: #222; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .gallery { background: #fff; border-radius: 16px; display: grid; place-items: center; aspect-ratio: 1; }
    .gallery img { width: 70%; }
    h1 { font-size: 26px; margin: 8px 0; }
    .price { color: #d6336c; font-size: 22px; font-weight: 700; }
    .colors { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .colors button { border: 2px solid #ddd; border-radius: 99px; background: #fff; padding: 6px 14px; cursor: pointer; }
    .colors button.on { border-color: #d6336c; color: #d6336c; font-weight: 600; }
    .note { font-size: 13px; color: #666; line-height: 1.5; background: #fff; padding: 12px 14px; border-radius: 10px; }
    @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="gallery"><img id="pimg" src="lens/lens_brown.png" alt=""></div>
    <div>
      <h1>Lens màu Demo – 14.2mm</h1>
      <div class="price">320.000₫</div>
      <div class="colors" id="colors"></div>
      <button type="button" class="lens-tryon-button" data-lens-tryon id="tryBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Thử lens trực tiếp</span>
      </button>
      <p class="note">Trang demo độc lập (không cần WordPress). Mở qua <b>https</b> hoặc <b>http://localhost</b> để trình duyệt cho phép camera.
        Thêm <code>?lensdebug</code> vào URL để xem FPS. Ảnh lens trong thư mục <code>demo/lens/</code> là ảnh vẽ mẫu chỉ để thử kỹ thuật.</p>
    </div>
  </div>

  <script>
    var LENSES = [
      { id: 'brown', name: 'Nâu', gdia: 13.2, image: 'lens/lens_brown.png', opacity: 0.9 },
      { id: 'hazel', name: 'Hazel', gdia: 13.4, image: 'lens/lens_hazel.png', opacity: 0.9 },
      { id: 'gray',  name: 'Xám',  gdia: 13.6, image: 'lens/lens_gray.png' },
      { id: 'blue',  name: 'Xanh dương', gdia: 13.4, image: 'lens/lens_blue.png' },
      { id: 'navy',  name: 'Navy', gdia: 13.0, image: 'lens/lens_navy.png', opacity: 0.85 },
      { id: 'green', name: 'Xanh lá', gdia: 13.4, image: 'lens/lens_green.png' }
    ].map(function (l) {
      return Object.assign({ productId: 1, group: 'Lens màu Demo', label: 'Lens màu Demo – ' + l.name, priceHtml: '320.000₫', current: true }, l);
    });

    window.LensTryOnConfig = {
      lenses: LENSES,
      watermark: 'Demo Lens Shop',
      onAddToCart: function (lens, ui) { ui._toast('Demo: đã thêm “' + lens.label + '” vào giỏ'); }
    };

    // Mô phỏng chọn màu trên trang sản phẩm -> nút thử mở đúng màu đó
    var colors = document.getElementById('colors');
    LENSES.forEach(function (l, i) {
      var b = document.createElement('button');
      b.textContent = l.name;
      if (!i) b.className = 'on';
      b.onclick = function () {
        [].forEach.call(colors.children, function (c) { c.className = ''; });
        b.className = 'on';
        document.getElementById('pimg').src = l.image;
        document.getElementById('tryBtn').setAttribute('data-lens-id', l.id);
      };
      colors.appendChild(b);
    });
  </script>
  <script src="assets/js/lens-tryon.js"></script>
</body>
</html>
